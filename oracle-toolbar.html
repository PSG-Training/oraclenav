<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Understanding the Toolbar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --psg-blue:#077CAB; --psg-navy:#0C2340; --card-gray:#EAEAEA;
    --page-bg:#F5F5F5; --white:#FFFFFF; --correct:#1F7A3D; --muted:#5A6B7D;
    --font-head:"Montserrat","Segoe UI",Arial,sans-serif;
    --font-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;overflow:hidden;}
  body{background:var(--page-bg);font-family:var(--font-body);color:var(--psg-navy);-webkit-font-smoothing:antialiased;}
  .wrap{height:100%;max-width:1100px;margin:0 auto;padding:clamp(10px,2vh,20px) clamp(12px,2vw,24px);
    display:flex;flex-direction:column;gap:clamp(8px,1.4vh,14px);min-height:0;overflow:auto;}

  .head{flex:0 0 auto;}
  .titlerow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  h1{font-family:var(--font-head);font-weight:700;font-size:clamp(17px,min(3vw,4.2vh),30px);margin:0;line-height:1.15;}
  .progress{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;color:var(--muted);}
  .bar{width:clamp(80px,14vw,170px);height:8px;background:var(--card-gray);border-radius:4px;overflow:hidden;}
  .bar span{display:block;height:100%;width:0;background:var(--correct);transition:width .3s ease;}
  .rule{height:4px;background:var(--psg-blue);width:58px;border-radius:2px;margin:6px 0 clamp(6px,1.2vh,12px);}
  .prompt{font-size:clamp(14px,min(1.9vw,2.6vh),19px);line-height:1.4;margin:0;}

  /* ---------- toolbar picture (desktop) ---------- */
  .toolbar{flex:0 0 auto;position:relative;width:100%;aspect-ratio:986/102;border-radius:6px;overflow:hidden;
    box-shadow:0 4px 16px rgba(12,35,64,.16);background:#5f5f5f;}
  .toolbar img{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .hot{position:absolute;border:2px solid var(--psg-blue);border-radius:4px;background:rgba(7,124,171,.08);
    padding:0;cursor:pointer;transition:background-color .12s ease, box-shadow .12s ease;}
  .hot:hover{background:rgba(7,124,171,.25);box-shadow:0 0 0 2px rgba(255,255,255,.8);}
  .hot:focus-visible{outline:3px solid var(--psg-navy);outline-offset:1px;}
  .hot.seen{border-color:var(--correct);background:rgba(31,122,61,.10);}
  .hot.active{background:rgba(7,124,171,.32);border-color:var(--psg-blue);box-shadow:0 0 0 3px #fff;}
  .hot.seen::after{content:"✓";position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:0 3px 0 4px;
    background:var(--correct);color:#fff;font:700 10px/14px Arial,sans-serif;text-align:center;}
  .grayhot{position:absolute;border:0;background:transparent;padding:0;cursor:help;}

  /* ---------- icon grid (phones) ---------- */
  .grid{display:none;flex:0 0 auto;grid-template-columns:repeat(5,1fr);gap:6px;}
  .gbtn{position:relative;height:44px;border:2px solid var(--psg-blue);border-radius:8px;background:#D4D0C8;cursor:pointer;padding:0;}
  .gbtn.seen{border-color:var(--correct);}
  .gbtn.active{box-shadow:0 0 0 3px rgba(7,124,171,.35);}
  .gbtn.seen::after{content:"✓";position:absolute;top:-1px;right:-1px;width:14px;height:14px;border-radius:0 5px 0 5px;
    background:var(--correct);color:#fff;font:700 10px/14px Arial,sans-serif;text-align:center;}
  .sprite{display:block;margin:auto;background-repeat:no-repeat;}

  /* ---------- info card ---------- */
  .card{flex:0 1 auto;min-height:150px;overflow:auto;background:var(--white);border:1px solid var(--card-gray);
    border-left:6px solid var(--psg-blue);border-radius:10px;padding:clamp(12px,2.2vh,22px) clamp(14px,2vw,26px);
    display:flex;gap:clamp(12px,2vw,24px);align-items:flex-start;}
  .card.gray{border-left-color:#9AA5B1;}
  .card.done{border-left-color:var(--correct);}
  .bigicon{flex:0 0 auto;border-radius:8px;background:#D4D0C8;border:1px solid #B9B4AA;padding:8px;}
  .cardtext{min-width:0;}
  .cardtext h2{font-family:var(--font-head);font-weight:700;font-size:clamp(17px,min(2.4vw,3.4vh),26px);margin:0 0 6px;}
  .cardtext p{font-size:clamp(15px,min(1.9vw,2.6vh),19px);line-height:1.45;margin:0 0 10px;}
  .shortcut{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--muted);font-weight:600;}
  kbd{font-family:var(--font-body);font-weight:600;font-size:14px;color:var(--psg-navy);background:var(--page-bg);
    border:1px solid #C9CED4;border-bottom-width:3px;border-radius:5px;padding:1px 7px;}
  .tip{margin-top:10px;font-size:15px;line-height:1.4;background:#E6F2F7;border-radius:6px;padding:8px 10px;}
  .tip b{color:var(--psg-blue);}
  .hidden{display:none !important;}

  @media (max-width:700px){
    .wrap{max-height:430px;padding:10px;gap:8px;}
    .toolbar{display:none;}
    .grid{display:grid;}
    .rule{margin:4px 0 6px;}
    .prompt{font-size:13px;}
    .progress .bar{display:none;}
    .progress{font-size:12px;}
    .card{padding:10px;gap:10px;min-height:70px;border-left-width:5px;}
    .bigicon{padding:4px;}
    .cardtext h2{font-size:16px;margin-bottom:2px;}
    .cardtext p{font-size:13px;line-height:1.35;margin-bottom:6px;}
    .shortcut{font-size:12px;} kbd{font-size:12px;}
    .tip{font-size:12px;padding:5px 8px;margin-top:6px;}
  }
  @media (max-width:700px) and (max-height:340px){ .prompt{display:none;} .rule{margin:2px 0;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="titlerow">
      <h1 id="title">Understanding the Toolbar</h1>
      <div class="progress"><span id="count"></span><div class="bar"><span id="barfill"></span></div></div>
    </div>
    <div class="rule"></div>
    <p class="prompt" id="prompt"></p>
  </div>

  <div class="toolbar" id="toolbar"><img id="tbimg" alt="The Oracle Forms menu bar and toolbar"></div>
  <div class="grid" id="grid" role="group" aria-label="Toolbar buttons"></div>

  <div class="card" id="card" role="status" aria-live="polite">
    <div class="bigicon hidden" id="bigicon"><span class="sprite" id="bigsprite"></span></div>
    <div class="cardtext">
      <h2 id="cname"></h2>
      <p id="cdesc"></p>
      <div class="shortcut hidden" id="cshort">Shortcut: <span id="ckeys"></span></div>
      <div class="tip hidden" id="ctip"></div>
    </div>
  </div>
</div>

const TITLE  = "Understanding the Toolbar";
const PROMPT = "Click each highlighted button in the Oracle toolbar to learn what it does.";
const START  = {name:"Pick a button to start", desc:"There are 15 highlighted buttons. Each one you open gets a green check, so you can see what's left."};
const DONE_NOTE = "<b>Nice work!</b> You've explored all 15 buttons. Click any button to review it again.";

const BUTTONS = [
  {x:40,  name:"New",                   desc:"Starts a new record.", keys:"Ctrl + Down Arrow"},
  {x:85,  name:"Find",                  desc:"Searches for one specific record.", keys:""},
  {x:130, name:"Show Navigator",        desc:"Brings the Navigator window to the front so you can open a different screen.", keys:""},
  {x:195, name:"Save",                  desc:"Saves the information you've entered on the current form.", keys:"Ctrl + S"},
  {x:290, name:"Switch Responsibility", desc:"Changes to a different responsibility, which gives you a different set of functions.", keys:""},
  {x:335, name:"Print",                 desc:"Sends the active window to the printer.", keys:"Ctrl + P"},
  {x:378, name:"Close Form",            desc:"Closes the form you're working in.", keys:"F4"},
  {x:445, name:"Cut",                   desc:"Removes the selected data and places it on the clipboard.", keys:"Ctrl + X"},
  {x:490, name:"Copy",                  desc:"Copies the selected data to the clipboard.", keys:"Ctrl + C"},
  {x:536, name:"Paste",                 desc:"Puts the data you cut or copied into the active field.", keys:"Ctrl + V"},
  {x:581, name:"Clear Record",          desc:"Removes the data from the record you're working in.", keys:"F6",
   tip:"<b>Clear vs. Delete:</b> Clear Record only empties the record. Delete removes the whole record."},
  {x:625, name:"Delete",                desc:"Deletes the current record. This removes the whole record, not just the data in it.", keys:"Ctrl + Up Arrow",
   tip:"<b>Clear vs. Delete:</b> If you only want to empty the fields, use Clear Record instead."},
  {x:693, name:"Edit",                  desc:"Opens the current field so you can make changes to it.", keys:"Ctrl + E"},
  {x:830, name:"Attachments",           desc:"Opens the attachments (notes) for the current record.", keys:""},
  {x:943, name:"Help",                  desc:"Opens the help document for the current screen.", keys:"Ctrl + H"}
];
/* Grayed-out buttons that are not part of this lesson */
const GRAYED = [244, 737, 785, 877];
const GRAY_CARD = {name:"Not covered here", desc:"This button isn't part of this lesson. Try one of the highlighted buttons."};
/* ================================================================
   NO EDITS NEEDED BELOW THIS LINE
   ================================================================ */
(function(){
  const IMG_W=986, IMG_H=102, BOX=40, TOP=54, HOT=44, HOT_TOP=52, HOT_H=44;
  const $=id=>document.getElementById(id);
  const tb=$("toolbar"), grid=$("grid"), card=$("card");
  const seen=new Set(); let active=-1;

  $("title").textContent=TITLE; document.title=TITLE;
  $("prompt").textContent=PROMPT;
  $("tbimg").src=TOOLBAR_IMG;

  function spriteStyle(el, x, px){
    const s=px/BOX;
    el.style.width=px+"px"; el.style.height=px+"px";
    el.style.backgroundImage="url("+TOOLBAR_IMG+")";
    el.style.backgroundSize=(IMG_W*s)+"px "+(IMG_H*s)+"px";
    el.style.backgroundPosition=(-(x-BOX/2)*s)+"px "+(-TOP*s)+"px";
  }
  function place(el, x){
    el.style.left=((x-HOT/2)/IMG_W*100)+"%"; el.style.top=(HOT_TOP/IMG_H*100)+"%";
    el.style.width=(HOT/IMG_W*100)+"%"; el.style.height=(HOT_H/IMG_H*100)+"%";
  }

  const hots=BUTTONS.map((b,i)=>{
    const h=document.createElement("button"); h.type="button"; h.className="hot";
    h.setAttribute("aria-label",b.name); h.title=b.name;
    place(h,b.x); h.addEventListener("click",()=>open(i)); tb.appendChild(h); return h;
  });
  GRAYED.forEach(x=>{
    const g=document.createElement("button"); g.type="button"; g.className="grayhot"; g.tabIndex=-1;
    g.setAttribute("aria-label","Grayed-out button"); place(g,x);
    g.addEventListener("click",showGray); tb.appendChild(g);
  });
  const gbtns=BUTTONS.map((b,i)=>{
    const g=document.createElement("button"); g.type="button"; g.className="gbtn"; g.setAttribute("aria-label",b.name);
    const sp=document.createElement("span"); sp.className="sprite"; spriteStyle(sp,b.x,34);
    g.appendChild(sp); g.addEventListener("click",()=>open(i)); grid.appendChild(g); return g;
  });

  function bigIconSize(){ return window.innerWidth<=700 ? 44 : Math.round(Math.min(96, Math.max(56, window.innerHeight*0.12))); }

  function render(){
    hots.forEach((h,i)=>{ h.classList.toggle("seen",seen.has(i)); h.classList.toggle("active",i===active); });
    gbtns.forEach((g,i)=>{ g.classList.toggle("seen",seen.has(i)); g.classList.toggle("active",i===active); });
    $("count").textContent="Explored "+seen.size+" of "+BUTTONS.length;
    $("barfill").style.width=(seen.size/BUTTONS.length*100)+"%";
  }

  function setCard(name, desc, keys, tip, x, cls){
    card.className="card"+(cls?" "+cls:"");
    $("cname").textContent=name; $("cdesc").innerHTML=desc;
    $("cshort").classList.toggle("hidden",!keys);
    $("ckeys").innerHTML = keys ? keys.split(" + ").map(k=>"<kbd>"+k+"</kbd>").join(" + ") : "";
    $("ctip").classList.toggle("hidden",!tip); $("ctip").innerHTML=tip||"";
    $("bigicon").classList.toggle("hidden", x==null);
    if(x!=null) spriteStyle($("bigsprite"), x, bigIconSize());
  }

  function open(i){
    const b=BUTTONS[i]; active=i; seen.add(i); render();
    const allDone = seen.size===BUTTONS.length;
    let tip=b.tip||"";
    if(allDone) tip = (tip? tip+"<br>" : "") + DONE_NOTE;
    setCard(b.name, b.desc, b.keys, tip, b.x, allDone ? "done" : "");
  }
  function showGray(){ active=-1; render(); setCard(GRAY_CARD.name, GRAY_CARD.desc, "", "", null, "gray"); }

  window.addEventListener("resize",()=>{ if(active>=0) spriteStyle($("bigsprite"), BUTTONS[active].x, bigIconSize()); });

  setCard(START.name, START.desc, "", "", null, "");
  render();
})();
</script>
